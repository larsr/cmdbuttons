[project]
name = "cmdbuttons"
version = "0.1.0"
description = "Opens a window with configurable CLI command buttons and stdout"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt5",
    "watchdog",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cmdbuttons"]

[project.scripts]
cmdbuttons = "cmdbuttons:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
    "I",  # isort
    "ANN",  # flake8-annotations
    "C4",  # flake8-comprehensions
    "SIM",  # flake8-simplify
    "UP",  # pyupgrade
    "ARG",  # flake8-unused-arguments
]
